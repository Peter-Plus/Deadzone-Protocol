<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeKit · 特效预览器</title>
<style>
:root{color-scheme:dark;font:14px system-ui,'Microsoft YaHei',sans-serif;color:#e5eaf0;background:#11191f}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:290px 1fr;grid-template-rows:72px 1fr 86px}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #32414c;background:#17232b}header h1{font-size:21px;font-weight:550;margin:0}header small{display:block;color:#96aab6;font-size:12px;margin-top:4px}nav{display:flex;gap:10px}aside{grid-row:2/4;padding:20px;background:#17232b;overflow:auto;border-right:1px solid #32414c}label{display:block;color:#9fb1bc;margin:15px 0 7px;font-size:12px}button,select,input{font:inherit}button,select{color:#e5eaf0;border:1px solid #4a606d;background:#253743;border-radius:5px;padding:8px 10px}button{cursor:pointer}button:hover{background:#38515f}select{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}main{position:relative;min-width:0;min-height:0}canvas{width:100%;height:100%;display:block}#badge{position:absolute;top:20px;left:24px;background:#17232bdc;border:1px solid #455761;padding:12px 16px;border-radius:6px;pointer-events:none}#badge strong{display:block;font-size:16px;font-weight:500;margin-bottom:5px}#badge span{font-size:12px;color:#adc0ca}#error{position:absolute;bottom:18px;left:20px;right:20px;background:#572c32;color:#ffe2e2;padding:14px;border-radius:6px;white-space:pre-wrap;max-height:40%;overflow:auto;display:none}footer{grid-column:2;padding:14px 22px;background:#17232b;display:grid;grid-template-columns:96px 1fr 90px;gap:14px;align-items:center;border-top:1px solid #32414c}input[type=range]{width:100%;accent-color:#c9b180}input[type=checkbox]{accent-color:#c9b180}#play{background:#c9b180;color:#17232b;border:0}.hint{font-size:12px;color:#9aafb9;line-height:1.7;margin-top:16px}#stats{font-size:12px;line-height:1.9;color:#b9c9d1;white-space:pre-line}hr{border:0;border-top:1px solid #32414c;margin:18px 0}.flag{display:inline-block;margin-top:12px;border-radius:4px;background:#284637;color:#b6d7be;padding:4px 8px;font-size:11px}input[type=file]{display:none}a{color:#c9b180}@media(max-width:800px){body{grid-template-columns:230px 1fr}header{padding:0 12px}header h1{font-size:16px}nav button{font-size:12px;padding:6px}aside{padding:12px}}
</style>
<header><div><h1>ForgeKit · 特效预览器</h1><small>独立特效入口 / 离线预览 / 共用播放器</small></div><nav><button id="open">打开 .vfx</button><button id="folder">选择 generated 目录</button><button id="defaults">内置样例</button></nav></header>
<aside><label>特效资产</label><select id="asset"></select><span class="flag" id="format">单文件 VFX</span><label>表现状态</label><select id="state"></select><label>元素变体</label><select id="variant"></select><label>同时显示</label><select id="count"><option value="1">1 个实例</option><option value="2">2 个实例 · 独立状态</option><option value="30">30 个实例</option><option value="50">50 个实例</option></select><label>命中反馈（突发粒子）</label><select id="allowed"><option value="yes">允许播放</option><option value="no">禁止播放 · 护盾／分身</option></select><label>观察距离</label><select id="distance"><option value="3">近景 · 3 米</option><option value="8" selected>中景 · 8 米</option><option value="20">远景 · 20 米</option></select><label>背景</label><select id="background"><option value="dark">暗色</option><option value="light">亮色</option></select><label><input type="checkbox" id="reference" checked> 显示参考模型</label><label><input type="checkbox" id="isolate"> 仅控制第一个实例</label><label><input type="checkbox" id="repeat"> 自动重播单次效果</label><div class="row"><button id="reset">重置视角</button><button id="clear">清除</button></div><hr><div id="stats"></div><p class="hint">拖动旋转，滚轮缩放，右键平移。可单独打开 .vfx；绑定型特效需从 generated 目录提供对应 GLB。内置样例已附参考模型。<br><br>状态切换只演示表现，不提交伤害、附魔或奖励。</p></aside>
<main id="viewport"><canvas id="canvas"></canvas><div id="badge"><strong id="title">加载中</strong><span id="binding"></span></div><div id="error"></div></main>
<footer><button id="play">播放</button><input type="range" id="timeline" min="0" max="1" step="0.001" value="0"><output id="clock">0.00 s</output></footer>
<input type="file" id="fileInput" accept=".vfx"><input type="file" id="folderInput" webkitdirectory multiple>
<script>/*APP*/</script></html>
