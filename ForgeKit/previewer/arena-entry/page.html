<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>结界入场 · 美术预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101118;color:#eee4e9;font:14px 'Microsoft YaHei',sans-serif}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:22px;top:22px;width:292px;padding:22px;background:#17151eef;border:1px solid #49303f;border-radius:14px;box-shadow:0 18px 60px #0006}h1{font-size:22px;margin:7px 0 12px}small{color:#d67b94;letter-spacing:2px}label{display:block;margin:17px 0 7px;color:#b8adb8}select,button{border:1px solid #674251;background:#28202d;color:#f6e8ed;padding:9px;border-radius:6px}select{width:100%}button{cursor:pointer}button:hover{background:#543044}input[type=range]{width:100%;accent-color:#d55f82}.row{display:flex;gap:7px;margin-top:12px}.row button{flex:1}.note{font-size:12px;line-height:1.8;color:#a89cab}#status{position:absolute;bottom:22px;left:22px;color:#e2b0be;background:#17151edd;padding:12px 18px;border-radius:7px}#error{color:#ff7184;white-space:pre-wrap}strong{color:#f3afc4}</style>
<canvas id="view"></canvas><aside><small>DEADZONE PROTOCOL · 26</small><h1>结界入场</h1><p class="note">石头交互爆裂，结界成形，暗红黑雾中尖刺破地，混沌显现。</p>
<label>查看内容</label><select id="mode"><option value="combo">混沌出场 · 组合</option><option value="stones">暗影石 / 噩梦之石</option><option value="spikes">六组尖刺 · 模型</option><option value="shadow">暗影石 · 交互爆炸</option><option value="nightmare">噩梦之石 · 交互爆炸</option><option value="rise">结界范围 · 升起特效</option><option value="boundary">结界 · 生成 / 持续 / 解除</option></select>
<label>尖刺组数 <strong id="countText">5</strong></label><input id="count" type="range" min="4" max="6" value="5" step="1">
<label>结界半径 <strong id="radiusText">12 m</strong></label><input id="radius" type="range" min="8" max="20" value="12" step="1">
<label>时间 <strong id="timeText">0.00 s</strong></label><input id="time" type="range" min="0" max="9" value="0" step="0.01">
<div class="row"><button id="play">暂停</button><button id="replay">重播</button><button id="random">换布局</button></div>
<div class="row"><button id="outside">全景</button><button id="inside">场内视角</button><button id="light">浅色背景</button></div>
<p class="note">拖动旋转 · 滚轮缩放 · 右键平移<br>模型与特效已制作；玩法、伤害及碰撞由后续游戏接入。预览可反向拖动时间。</p><div id="error"></div></aside><div id="status">载入正式资产…</div><script>/*APP*/</script></html>
