<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>命中溅血 · 低强度样件</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10161c;color:#e8ecef;font:14px system-ui,"Microsoft YaHei",sans-serif}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{font-size:24px;font-weight:550;margin:6px 0}header small{color:#cfad7d;letter-spacing:2px}header p{color:#aab6c1;margin:8px 0}aside{position:absolute;right:24px;top:24px;width:256px;padding:18px;background:#17212bf2;border:1px solid #384753;border-radius:10px}label{display:block;margin:14px 0 6px;color:#aab6c1}select,button,input{width:100%;font:inherit}select,button{padding:9px;color:#e8ecef;background:#293744;border:1px solid #526574;border-radius:5px}button{cursor:pointer;margin-top:10px}button.primary{background:#d7bf86;color:#17212b;border:0}input[type=checkbox]{width:auto}output{font-variant-numeric:tabular-nums;color:#d7bf86}footer{position:absolute;bottom:22px;left:28px;color:#aab6c1;line-height:1.8;pointer-events:none}.muted{font-size:12px;color:#aab6c1;line-height:1.6}#state{margin-top:14px;font-size:12px;line-height:1.8}
header,footer{padding:12px 16px;background:#17212be8;border-radius:8px}#state{white-space:pre-line}
</style><canvas id="view"></canvas><header><small>DEADZONE PROTOCOL / VFX 01</small><h1>命中溅血 · 低强度样件</h1><p>短促血滴 / 0.46 秒 / 无积血、无碎片</p></header>
<aside><label>观察距离</label><select id="distance"><option value="3">近距离 · 3 米</option><option value="8">中距离 · 8 米</option><option value="20">远距离 · 20 米</option></select>
<label>同时命中</label><select id="count"><option value="1">1 名疫鬼</option><option value="30">30 名疫鬼</option><option value="50">50 名疫鬼</option></select>
<label>命中对象（模拟玩法结果）</label><select id="target"><option value="enemy">可受伤敌人</option><option value="shield">高防护盾 · 不溅血</option><option value="clone">魅影分身 · 不溅血</option></select>
<label>场景明暗</label><select id="background"><option value="dark">暗色</option><option value="light">亮色</option></select>
<button id="play" class="primary">播放一次 · 空格</button><label><input id="repeat" type="checkbox"> 自动重复预览</label>
<label>定格查看 <output id="time">0.10 s</output></label><input id="scrub" type="range" min="0" max="0.5" step="0.01" value="0.10"><button id="clear">清除效果</button>
<div id="state">正在加载…</div><p class="muted">护盾／分身选项仅模拟禁止溅血事件，仍用疫鬼模型展示。群体按网格排布，最近一排位于所选距离。</p></aside>
<footer>拖动时间轴检查起点、血滴与淡出。<br>命中溅血美术已验收；敌人战斗流程尚未接入。</footer><script>/*APP*/</script></html>
